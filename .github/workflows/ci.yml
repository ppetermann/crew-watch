name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --all

      - name: cargo clippy (library only)
        run: cargo clippy --all-targets --no-default-features -- -D warnings

      - name: cargo test (library only)
        run: cargo test --all --no-default-features

      # The default features build ring (TLS for the OpenRouter client), whose
      # C code needs a darwin C toolchain, so the default-feature darwin checks
      # run on the macOS job. The library alone builds no TLS code and is
      # cross-checked here.
      - name: Add darwin check target
        run: rustup target add aarch64-apple-darwin

      - name: cargo check (darwin, library only)
        run: cargo check --target aarch64-apple-darwin --no-default-features

  check-macos:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --all

      - name: cargo test (library only)
        run: cargo test --all --no-default-features

      - name: cargo check (both darwin targets)
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo check --target aarch64-apple-darwin
          cargo check --target x86_64-apple-darwin

      - name: cargo build --release
        run: cargo build --release

      - name: Smoke test (fake agent detected end-to-end)
        run: |
          bash -c 'exec -a claude /bin/sleep 300' & fake=$!
          out=$(./target/release/crew-watch --once --no-quota)
          kill "$fake"
          echo "$out"
          echo "$out" | grep -E '^cores=[1-9]'        # system snapshot is real
          echo "$out" | grep -E '^\S+ +claude +'      # fake agent detected (RUNTIME col)
