[package]
name = "crew-watch"
version = "0.4.0"
edition = "2021"
description = "Terminal monitor for firstmate fleets: htop-style system overview plus one row per running AI agent session, with subtree-aggregated CPU and memory, task and activity."
license = "MIT"
repository = "https://github.com/ppetermann/crew-watch"
homepage = "https://github.com/ppetermann/crew-watch"
readme = "README.md"
keywords = ["firstmate", "tui", "monitoring", "htop", "agents"]
categories = ["command-line-utilities", "os::linux-apis", "os::macos-apis"]
exclude = ["/docs/img", "/.github", "/scripts"]

[lib]
name = "crew_watch"
path = "src/lib.rs"

[[bin]]
name = "crew-watch"
path = "src/main.rs"
required-features = ["tui"]

[features]
default = ["tui"]
# The terminal UI and its CLI. Library users who only want the data layer
# depend with `default-features = false` and never compile these.
tui = ["dep:ratatui", "dep:crossterm", "dep:clap"]

[dependencies]
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }
clap = { version = "4.5", features = ["derive", "env"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

[profile.release]
lto = "thin"
codegen-units = 1
