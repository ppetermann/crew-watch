[package]
name = "crew-watch"
version = "0.1.0"
edition = "2021"
description = "Terminal monitor for firstmate fleets: htop-style system overview plus one row per running AI agent session, with subtree-aggregated CPU and memory, task and activity."
license = "MIT"
repository = "https://github.com/ppetermann/crew-watch"
homepage = "https://github.com/ppetermann/crew-watch"
readme = "README.md"
keywords = ["firstmate", "tui", "monitoring", "htop", "agents"]
categories = ["command-line-utilities", "os::linux-apis"]
exclude = ["/docs/img", "/.github"]

[[bin]]
name = "crew-watch"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
